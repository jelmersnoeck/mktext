name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string

env:
  APP_NAME: mktext

jobs:
  build:
    name: Build and Release
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '5.9'

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build release binary
        run: |
          swift build -c release --arch arm64 --arch x86_64

      - name: Generate app icon
        run: |
          swift generate_icon.swift
          iconutil -c icns mktext.iconset -o AppIcon.icns

      - name: Create app bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Create bundle structure
          mkdir -p "$APP_NAME.app/Contents/MacOS"
          mkdir -p "$APP_NAME.app/Contents/Resources"

          # Copy executable
          cp .build/release/$APP_NAME "$APP_NAME.app/Contents/MacOS/"

          # Copy icon
          cp AppIcon.icns "$APP_NAME.app/Contents/Resources/"

          # Create Info.plist with version
          cat > "$APP_NAME.app/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>$APP_NAME</string>
              <key>CFBundleIdentifier</key>
              <string>com.mktext.app</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$APP_NAME</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION</string>
              <key>CFBundleVersion</key>
              <string>$VERSION</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticTermination</key>
              <true/>
              <key>NSSupportsSuddenTermination</key>
              <true/>
              <key>CFBundleDocumentTypes</key>
              <array>
                  <dict>
                      <key>CFBundleTypeName</key>
                      <string>Markdown Document</string>
                      <key>CFBundleTypeRole</key>
                      <string>Editor</string>
                      <key>LSHandlerRank</key>
                      <string>Owner</string>
                      <key>LSItemContentTypes</key>
                      <array>
                          <string>net.daringfireball.markdown</string>
                          <string>public.plain-text</string>
                      </array>
                  </dict>
              </array>
              <key>UTImportedTypeDeclarations</key>
              <array>
                  <dict>
                      <key>UTTypeConformsTo</key>
                      <array>
                          <string>public.plain-text</string>
                      </array>
                      <key>UTTypeDescription</key>
                      <string>Markdown Document</string>
                      <key>UTTypeIdentifier</key>
                      <string>net.daringfireball.markdown</string>
                      <key>UTTypeTagSpecification</key>
                      <dict>
                          <key>public.filename-extension</key>
                          <array>
                              <string>md</string>
                              <string>markdown</string>
                          </array>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

      - name: Code sign app (ad-hoc)
        run: |
          codesign --force --deep --sign - "$APP_NAME.app"

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="${APP_NAME}-${VERSION}-universal.dmg"

          # Create a temporary directory for DMG contents
          mkdir -p dmg_contents
          cp -R "$APP_NAME.app" dmg_contents/

          # Create a symbolic link to Applications
          ln -s /Applications dmg_contents/Applications

          # Create DMG
          hdiutil create -volname "$APP_NAME" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            "$DMG_NAME"

          echo "dmg_name=$DMG_NAME" >> $GITHUB_OUTPUT

      - name: Create ZIP archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="${APP_NAME}-${VERSION}-universal.zip"

          ditto -c -k --keepParent "$APP_NAME.app" "$ZIP_NAME"

          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Generate checksums
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          shasum -a 256 "${APP_NAME}-${VERSION}-universal.dmg" > checksums.txt
          shasum -a 256 "${APP_NAME}-${VERSION}-universal.zip" >> checksums.txt

          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: mktext ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-universal.dmg
            ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-universal.zip
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (for manual workflow)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mktext-${{ steps.version.outputs.version }}
          path: |
            ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-universal.dmg
            ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}-universal.zip
            checksums.txt
