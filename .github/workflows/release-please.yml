name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          package-name: mktext

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build release binary
        run: |
          swift build -c release --arch arm64 --arch x86_64

      - name: Generate app icon
        run: |
          swift generate_icon.swift
          iconutil -c icns mktext.iconset -o AppIcon.icns

      - name: Create app bundle
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          APP_NAME="mktext"

          mkdir -p "$APP_NAME.app/Contents/MacOS"
          mkdir -p "$APP_NAME.app/Contents/Resources"

          cp .build/release/$APP_NAME "$APP_NAME.app/Contents/MacOS/"
          cp AppIcon.icns "$APP_NAME.app/Contents/Resources/"

          cat > "$APP_NAME.app/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>mktext</string>
              <key>CFBundleIdentifier</key>
              <string>com.mktext.app</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>mktext</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSSupportsAutomaticTermination</key>
              <true/>
              <key>NSSupportsSuddenTermination</key>
              <true/>
              <key>CFBundleDocumentTypes</key>
              <array>
                  <dict>
                      <key>CFBundleTypeName</key>
                      <string>Markdown Document</string>
                      <key>CFBundleTypeRole</key>
                      <string>Editor</string>
                      <key>LSHandlerRank</key>
                      <string>Owner</string>
                      <key>LSItemContentTypes</key>
                      <array>
                          <string>net.daringfireball.markdown</string>
                          <string>public.plain-text</string>
                      </array>
                  </dict>
              </array>
              <key>UTImportedTypeDeclarations</key>
              <array>
                  <dict>
                      <key>UTTypeConformsTo</key>
                      <array>
                          <string>public.plain-text</string>
                      </array>
                      <key>UTTypeDescription</key>
                      <string>Markdown Document</string>
                      <key>UTTypeIdentifier</key>
                      <string>net.daringfireball.markdown</string>
                      <key>UTTypeTagSpecification</key>
                      <dict>
                          <key>public.filename-extension</key>
                          <array>
                              <string>md</string>
                              <string>markdown</string>
                          </array>
                      </dict>
                  </dict>
              </array>
          </dict>
          </plist>
          EOF

      - name: Code sign app (ad-hoc)
        run: |
          codesign --force --deep --sign - mktext.app

      - name: Create DMG
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          mkdir -p dmg_contents
          cp -R mktext.app dmg_contents/
          ln -s /Applications dmg_contents/Applications

          hdiutil create -volname "mktext" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            "mktext-${VERSION}-universal.dmg"

      - name: Create ZIP archive
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          ditto -c -k --keepParent mktext.app "mktext-${VERSION}-universal.zip"

      - name: Generate checksums
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          shasum -a 256 "mktext-${VERSION}-universal.dmg" > checksums.txt
          shasum -a 256 "mktext-${VERSION}-universal.zip" >> checksums.txt
          cat checksums.txt

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" \
            "mktext-${VERSION}-universal.dmg" \
            "mktext-${VERSION}-universal.zip" \
            checksums.txt \
            --clobber
